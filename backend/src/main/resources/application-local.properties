# Database
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Logging
logging.level.com.amwohaji=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#FILE
file.upload-dir=./uploads/logs

# 파일 단일 최대 크기 (기본값: 1MB -> 50MB로 변경)
spring.servlet.multipart.max-file-size=50MB

# 1개 HTTP 요청당 최대 크기 (기본값: 10MB -> 50MB로 변경)
spring.servlet.multipart.max-request-size=50MB